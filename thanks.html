<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensagem enviada | Car Consórcios</title>
    <meta name="description" content="Página de confirmação de envio de formulário da Car Consórcios." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at top left, rgba(255,95,126,0.2), transparent 35%), linear-gradient(135deg, #07111f, #142542);
        color: #f7f9fc;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(100%, 640px);
        padding: 36px;
        border-radius: 24px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 20px 40px rgba(0,0,0,0.28);
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #ff5f7e, #ff2e63);
        font-size: 1.8rem;
      }
      h1 { font-size: clamp(1.8rem, 3vw, 2.4rem); margin: 0 0 12px; }
      p { color: #9fb0c9; line-height: 1.7; }
      .btn {
        display: inline-block;
        margin-top: 22px;
        padding: 12px 18px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff5f7e, #ff2e63);
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon"><i class="fa-solid fa-circle-check"></i></div>
      <h1>Mensagem enviada com sucesso!</h1>
      <p>Obrigado por entrar em contato. Nossa equipe receberá sua solicitação e retornará em breve com uma proposta personalizada para o seu consórcio automotivo.</p>
      <a class="btn" href="/">Voltar para a página inicial</a>
    </main>
  </body>
</html>
